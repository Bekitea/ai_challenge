# nginx для собранного фронтенда: раздаёт статику и проксирует /api на бэкенд.
# Благодаря прокси браузер общается только с http://localhost:3000 (один origin),
# а заголовок Authorization: Bearer <ключ> передаётся на web без правок.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;

        # Генерация локальной моделью может быть долгой, а при LLM Gateway
        # запрос ещё и ждёт очередь к Ollama. Дефолт nginx (60s) обрывает
        # такие запросы с 504, поэтому таймауты должны перекрывать
        # LLM_REQUEST_TIMEOUT бэкенда.
        proxy_connect_timeout 15s;
        proxy_send_timeout 1000s;
        proxy_read_timeout 1000s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любой неизвестный путь отдаёт index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
