name: AI Code Review

# Лёгкий self-hosted раннер (см. docker-compose.runner.yml) собирает diff PR и
# отправляет его на AI-бэкенд одним HTTP-запросом, затем публикует ревью
# комментарием. Раннер не хранит LLM-ключей и доступов к БД.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect diff and metadata
        env:
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/${BASE_REF}...HEAD" > diff.patch
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt

          jq -n \
            --rawfile diff diff.patch \
            --rawfile changed changed.txt \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg base "$BASE_REF" \
            --arg head "$HEAD_REF" \
            '{
               repo: $repo,
               pr_number: $pr_number,
               pr_title: $title,
               author: $author,
               base_branch: $base,
               head_branch: $head,
               changed_files: ($changed | split("\n") | map(select(length > 0))),
               diff: $diff
             }' > payload.json

      - name: Call AI review backend
        id: call
        continue-on-error: true
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: |
          set -euo pipefail
          url="${REVIEW_API_URL:-http://web:8080}"
          curl -fsS -X POST "${url}/api/review-pr" \
            -H "Authorization: Bearer ${REVIEW_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json > review.json

      - name: Publish review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -s review.json ]; then
            jq -r '.review' review.json > comment.md
          else
            printf '%s\n' \
              'AI-ревью недоступно: бэкенд не ответил на запрос.' \
              '' \
              'Проверьте, что сервис `web` запущен и доступен по `REVIEW_API_URL`.' \
              > comment.md
          fi

          jq -n --arg body "$(cat comment.md)" '{body: $body}' > comment.json
          curl -fsS -X POST \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @comment.json
